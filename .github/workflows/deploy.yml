name: Deploy

# Manual only — Vercel's and Railway's own git-triggered auto-deploy are both
# disabled (web/vercel.json git.deploymentEnabled: false, and Railway's Auto
# Deploy toggle is off). This is the only thing that ships a deployment, and
# it only ships once checks.yml (the same checks ci.yml runs) passes.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [both, web, ml-service]
        default: both

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  web:
    needs: checks
    # `success()` is required here: once a job has a custom `if:`, that
    # expression replaces (not adds to) the default "needs job succeeded"
    # check, so without it this would still run after checks fails.
    if: ${{ success() && (inputs.target == 'both' || inputs.target == 'web') }}
    runs-on: ubuntu-latest
    # No working-directory: the Vercel project's Root Directory is "web", so the
    # CLI must run from the repo root or it looks for web/web/package.json.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global vercel@latest
      - name: Show target Vercel project
        run: vercel project inspect --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      # No `vercel build` / `--prebuilt` here on purpose: that path forces the
      # framework-native build and skips Dockerfile.vercel entirely. Plain
      # `vercel deploy` lets Vercel detect Dockerfile.vercel at the project
      # root (web/) and build+push the container instead.
      - run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}

  ml-service:
    needs: checks
    if: ${{ success() && (inputs.target == 'both' || inputs.target == 'ml-service') }}
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Upload the whole repo, not just ml-service/ — the Railway service's
      # own Root Directory setting ("/ml-service") expects to find that
      # folder inside what it receives, the same way it would from a normal
      # git-triggered deploy.
      - run: railway up --service=FinSight
