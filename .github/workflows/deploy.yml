name: Deploy

# Manual only — Vercel's and Railway's own git-triggered auto-deploy are both
# disabled (web/vercel.json git.deploymentEnabled: false, and Railway's Auto
# Deploy toggle is off). This is the only thing that ships a deployment.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [both, web, ml-service]
        default: both

jobs:
  web:
    if: ${{ inputs.target == 'both' || inputs.target == 'web' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  ml-service:
    if: ${{ inputs.target == 'both' || inputs.target == 'ml-service' }}
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    defaults:
      run:
        working-directory: ml-service
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: railway up --service=ml-service
