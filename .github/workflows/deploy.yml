name: Deploy

# Manual only — Vercel's own git-triggered auto-deploy is disabled
# (web/vercel.json git.deploymentEnabled: false). This is the only thing that ships a
# deployment, and it only ships once checks.yml (the same checks ci.yml runs) passes.
#
# This deploys the web app only. The ML service has no server to deploy: its scheduled jobs
# run on GitHub Actions (ml-forecast.yml, ml-anomalies.yml). The old Railway deploy job is
# kept for reference in .github/archive/railway-deploy.yml.
on:
  workflow_dispatch:

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  web:
    # Runs only if the checks job succeeded (the default for `needs`).
    needs: checks
    runs-on: ubuntu-latest
    # No working-directory: the Vercel project's Root Directory is "web", so the
    # CLI must run from the repo root or it looks for web/web/package.json.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global vercel@latest
      - name: Show target Vercel project
        run: vercel project inspect --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      # No `vercel build` / `--prebuilt` here on purpose: that path forces the
      # framework-native build and skips Dockerfile.vercel entirely. Plain
      # `vercel deploy` lets Vercel detect Dockerfile.vercel at the project
      # root (web/) and build+push the container instead.
      - run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
