name: ML forecast

# Fills forecast_run / forecast_value in Supabase: the data behind the Forecast page
# and the chatbot's forecast answers. It runs the same command Railway's cron used to
# (`python -m app.forecast.run`), on a GitHub-hosted runner, so no server has to stay up.
#
# Schedule: TEMPORARILY daily at 18:00 UTC = 02:00 SGT, while the Forecast page is being set
# up. The intended schedule is monthly: "0 18 1 * *" = 02:00 SGT on the 2nd, the day after
# month end, so the month has closed. Each run is kept in forecast_run / forecast_value, so
# a daily schedule stores a new copy of the forecast every day. Cron times in GitHub
# Actions are UTC, and a run can start a few minutes late when GitHub is busy.
#
# Needs one repository secret: ML_DATABASE_URL (see ml-service/DEPLOY.md).
# You can also start it by hand: Actions -> ML forecast -> Run workflow.
on:
  schedule:
    # TODO: back to monthly ("0 18 1 * *") once the forecast is verified.
    - cron: "0 18 * * *"
  workflow_dispatch:

# One run at a time (the job also takes a database lock, so a second would just stop).
concurrency:
  group: ml-forecast
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forecast:
    name: Forecast the ledger
    # Pinned, as in ci.yml: ubuntu-latest now means Ubuntu 26.04, and the Python
    # packages are built and tested on 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ml-service
    env:
      DATABASE_URL: ${{ secrets.ML_DATABASE_URL }}
      # Prophet imports matplotlib, which wants a writable cache directory.
      MPLCONFIGDIR: /tmp/matplotlib
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The version the Dockerfile and requirements.txt are pinned for.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the forecast
        run: python -m app.forecast.run
