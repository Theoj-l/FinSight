name: CI

# Lint, typecheck, unit tests and end-to-end tests for the web app.
#
# Runs automatically on every push to main and every pull request, and can be started by
# hand. deploy.yml also calls this workflow (workflow_call) and only deploys if it passes,
# so the checks a deployment waits for are always the same ones CI runs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

# Cancel an in-progress run when the same branch/PR gets a new push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web · lint · types · unit · e2e
    # Pinned, not ubuntu-latest: that now points at Ubuntu 26.04, where Playwright's
    # WebKit build cannot start (it needs libicu74, which 24.04 has and 26.04 does not).
    # Move this forward when the Playwright version in web/package.json supports it.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Placeholder values only. The unit tests mock Supabase and the ML
      # service; the e2e tests just need these defined so `next dev` (started
      # by playwright.config.ts) and the middleware don't crash. No real
      # project, database, or secrets are involved.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      ML_SERVICE_URL: http://localhost:8000
      ML_SERVICE_TOKEN: ci-placeholder
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      # lib/gemini/client.ts throws at import time if this is unset, which
      # would take down any route that (transitively) imports it.
      GEMINI_API_KEY: ci-placeholder-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium webkit firefox

      - name: E2E tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
