# Tool configuration only. Dependencies are managed in requirements*.txt.
# The project targets the Python 3.14 release line (supported through 2030-10).

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint.per-file-ignores]
"datagen/config.py" = ["E501"]   # aligned business-model tables

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
