# Tool configuration only. Dependencies are managed in requirements*.txt.
# target-version is py39 because the project venv is currently Python 3.9;
# bump to py310+ once the venv moves (README asks for 3.10+).

[tool.ruff]
target-version = "py39"
line-length = 110

[tool.ruff.lint.per-file-ignores]
"datagen/config.py" = ["E501"]   # aligned business-model tables

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
